# Git Identity Guard 文案(中文定版,设计文档 §6.2)
# 注意:MessageFormat 会解析单引号,文案中避免使用英文单引号。

# ---- 设置页 ----
settings.title=Git Identity Guard
settings.precommit.label=启用 Commit 前校验(提交时若身份不匹配则弹窗确认)
settings.showemail.label=在通知中展示当前生效邮箱
settings.autoenable.label=检测到不匹配时自动开启 Commit 前校验
settings.lenient.label=宽松模式:该账号的 GitHub 已验证邮箱与下方白名单邮箱也视为放行
settings.allowlist.label=放行白名单邮箱(每行一个):
settings.notification.hint=提示:若从未看到弹窗,请检查 设置 -> 外观与行为 -> 通知 -> Git Identity Guard 是否被设为"不显示";开启 Commit 前校验可作为兜底。
settings.accounts.title=GitHub 账号与隐私邮箱缓存
settings.accounts.refresh=手动刷新
settings.accounts.refreshing=正在刷新隐私邮箱缓存…
settings.accounts.column.account=账号
settings.accounts.column.server=服务器
settings.accounts.column.email=隐私邮箱
settings.accounts.column.status=状态
settings.accounts.status.ok=已缓存
settings.accounts.status.fallback=合成邮箱(API 回退)
settings.accounts.status.empty=未获取
settings.accounts.status.ghe=不在保护范围(GHE)
settings.ignore.title=已忽略的仓库
settings.ignore.remove=移除所选
settings.ignore.column.repo=仓库
settings.ignore.column.account=账号

# ---- 通知 ----
notification.group.name=Git 身份保护
notification.title=Git 身份不匹配
notification.content.full=检测到仓库 Remote 指向您的 GitHub 账号 {0},但当前提交身份与隐私身份不符。当前提交邮箱:{1};当前用户名:{2}。应改为邮箱:{3};用户名:{0}。
notification.content.short=检测到仓库 Remote 指向您的 GitHub 账号 {0},但当前提交身份与隐私身份不符。
action.apply=应用隐私身份
action.ignore=忽略该仓库
task.applying=正在应用隐私邮箱…
notify.apply.success=Git 身份已更新
notify.apply.success.content=仓库 {0} 的提交邮箱已切换为 {1}
notify.apply.success.name.content=仓库 {0} 的提交用户名已切换为 {1}
notify.apply.success.both.content=仓库 {0} 的提交身份已切换为 用户名 {1}、邮箱 {2}
notify.apply.failure=Git 配置更新失败
notify.apply.failure.content=仓库 {0}:{1}
email.unset=(未设置)

# ---- Commit 前校验弹窗 ----
checkin.title=隐私邮箱保护
checkin.message=您正尝试以与 GitHub 隐私身份不符的身份提交代码到受保护仓库(命中账号:{0})。\n\n当前邮箱:{1}\n当前用户名:{2}\n推荐邮箱:{3}\n推荐用户名:{4}
checkin.apply=立即切换并继续 Commit
checkin.continue=本次继续使用当前邮箱
checkin.cancel=取消 Commit
checkin.switch.failure=切换失败,本次提交已取消。请处理下方错误后重新提交:

# ---- 获取失败原因(F1.2) ----
error.ghe=GHE 账号不在保护范围
error.network=网络请求失败
error.auth=认证失败或令牌已失效
error.rate.limit=触发 GitHub API 限流
error.no.id=无法获取账号数字 ID,无法合成隐私邮箱
error.unknown=未知错误
