# Git Identity Guard default messages (English).
# MessageFormat parses single quotes, so messages intentionally avoid contractions.

# ---- Settings ----
settings.title=Git Identity Guard
settings.precommit.label=Enable pre-commit checks (confirm identity mismatches before committing)
settings.showemail.label=Show the current effective email in notifications
settings.autoenable.label=Automatically enable pre-commit checks when a mismatch is detected
settings.lenient.label=Lenient mode: also accept verified GitHub emails and allowlisted emails
settings.allowlist.label=Allowed email addresses (one per line):
settings.notification.hint=Tip: If notifications never appear, check Settings > Appearance & Behavior > Notifications > Git Identity Guard and make sure popups are enabled. The pre-commit check can be used as a fallback.
settings.accounts.title=GitHub Accounts and Privacy Email Cache
settings.accounts.refresh=Refresh
settings.accounts.refreshing=Refreshing the privacy email cache...
settings.accounts.column.account=Account
settings.accounts.column.server=Server
settings.accounts.column.email=Privacy Email
settings.accounts.column.status=Status
settings.accounts.status.ok=Cached
settings.accounts.status.fallback=Generated email (API fallback)
settings.accounts.status.empty=Not available
settings.accounts.status.ghe=Outside protection scope (GHE)
settings.ignore.title=Ignored Repositories
settings.ignore.remove=Remove Selected
settings.ignore.column.repo=Repository
settings.ignore.column.account=Account

# ---- Notifications ----
notification.group.name=Git Identity Guard
notification.title=Git Identity Mismatch
notification.content.full=The repository remote belongs to your GitHub account {0}, but the current Git identity does not match its privacy identity. Current email: {1}; current name: {2}. Expected email: {3}; expected name: {0}.
notification.content.short=The repository remote belongs to your GitHub account {0}, but the current Git identity does not match its privacy identity.
action.apply=Apply Privacy Identity
action.ignore=Ignore Repository
task.applying=Applying the privacy identity...
notify.apply.success=Git Identity Updated
notify.apply.success.content=Repository {0} now uses commit email {1}.
notify.apply.success.name.content=Repository {0} now uses commit name {1}.
notify.apply.success.both.content=Repository {0} now uses commit identity {1} <{2}>.
notify.apply.failure=Git Configuration Update Failed
notify.apply.failure.content=Repository {0}: {1}
email.unset=(not set)

# ---- Pre-commit dialog ----
checkin.title=Privacy Identity Protection
checkin.message=You are about to commit to a protected repository with a Git identity that does not match the GitHub privacy identity (matched account: {0}).\n\nCurrent email: {1}\nCurrent name: {2}\nRecommended email: {3}\nRecommended name: {4}
checkin.apply=Switch Identity and Commit
checkin.continue=Commit Once with Current Identity
checkin.cancel=Cancel Commit
checkin.switch.failure=Identity Switch Failed

# ---- Git configuration failures ----
error.repository.unavailable=Repository is currently unavailable
error.repository.identity.unavailable=Repository or privacy identity is unavailable
error.git.verify.mismatch=Verification failed after writing: effective {0} is {1}
error.git.verify.unavailable=Unable to verify the value after writing: {0}
error.git.config.lock=The .git/config.lock file exists (another Git process may be running, or a stale lock may remain)
error.git.repository.readonly=The repository directory is not writable (read-only file system or insufficient permissions)
error.git.exit.code=Git exited with code {0}
error.separator=;\u0020

# ---- Privacy email retrieval failures ----
error.ghe=GitHub Enterprise accounts are outside the protection scope
error.network=Network request failed
error.auth=Authentication failed or the token has expired
error.rate.limit=GitHub API rate limit exceeded
error.no.id=Unable to obtain the numeric account ID required to generate a privacy email
error.unknown=Unknown error
