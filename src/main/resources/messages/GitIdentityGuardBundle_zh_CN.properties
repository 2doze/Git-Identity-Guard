# ---- 设置页 ----
settings.title=Git Identity Guard
settings.precommit.label=启用 Commit 前校验（提交时若身份不匹配则弹窗确认）
settings.showemail.label=在通知中展示当前生效邮箱
settings.autoenable.label=检测到不匹配时自动开启 Commit 前校验
settings.lenient.label=宽松模式：该账号的 GitHub 已验证邮箱与下方白名单邮箱也视为放行
settings.allowlist.label=放行白名单邮箱（每行一个）：
settings.notification.hint=提示：若从未看到弹窗，请检查 设置 > 外观与行为 > 通知 > Git Identity Guard 是否已启用弹窗；开启 Commit 前校验可作为兜底。
settings.accounts.title=GitHub 账号与隐私邮箱缓存
settings.accounts.refresh=手动刷新
