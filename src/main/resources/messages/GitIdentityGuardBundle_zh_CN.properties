settings.accounts.status.fallback=合成邮箱（API 回退）
settings.accounts.status.empty=未获取
settings.accounts.status.ghe=不在保护范围（GHE）
settings.ignore.title=已忽略的仓库
settings.ignore.remove=移除所选
settings.ignore.column.repo=仓库
settings.ignore.column.account=账号

# ---- 通知 ----
notification.group.name=Git 身份保护
notification.title=Git 身份不匹配
notification.content.full=检测到仓库 Remote 指向您的 GitHub 账号 {0}，但当前提交身份与隐私身份不符。当前提交邮箱：{1}；当前用户名：{2}。应改为邮箱：{3}；用户名：{0}。
notification.content.short=检测到仓库 Remote 指向您的 GitHub 账号 {0}，但当前提交身份与隐私身份不符。
action.apply=应用隐私身份
action.ignore=忽略该仓库
task.applying=正在应用隐私身份...
notify.apply.success=Git 身份已更新
notify.apply.success.content=仓库 {0} 的提交邮箱已切换为 {1}。
notify.apply.success.name.content=仓库 {0} 的提交用户名已切换为 {1}。
notify.apply.success.both.content=仓库 {0} 的提交身份已切换为 {1} <{2}>。
notify.apply.failure=Git 配置更新失败
notify.apply.failure.content=仓库 {0}：{1}
email.unset=（未设置）

# ---- Commit 前校验弹窗 ----
checkin.title=隐私邮箱保护
checkin.message=您正尝试以与 GitHub 隐私身份不符的身份提交代码到受保护仓库（命中账号：{0}）。\n\n当前邮箱：{1}\n当前用户名：{2}\n推荐邮箱：{3}\n推荐用户名：{4}
checkin.apply=立即切换并继续 Commit
checkin.continue=本次继续使用当前身份
checkin.cancel=取消 Commit
checkin.switch.failure=身份切换失败

# ---- Git 配置失败原因 ----
error.repository.unavailable=仓库当前不可用
error.repository.identity.unavailable=仓库或隐私身份不可用
error.git.verify.mismatch=写入后校验失败：{0} 生效值为 {1}
error.git.verify.unavailable=写入后无法校验：{0}
error.git.config.lock=存在 .git/config.lock 锁文件（可能有其他 Git 进程正在运行或异常残留）
error.git.repository.readonly=仓库目录不可写（只读文件系统或权限不足）
error.git.exit.code=Git 退出码 {0}
error.separator=；

# ---- 获取隐私邮箱失败原因 ----
error.ghe=GHE 账号不在保护范围
error.network=网络请求失败
error.auth=认证失败或令牌已失效
error.rate.limit=触发 GitHub API 限流
error.no.id=无法获取账号数字 ID，无法合成隐私邮箱
error.unknown=未知错误
